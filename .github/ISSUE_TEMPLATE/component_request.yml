name: Component request
description: Suggest a component, or a new state for one that exists.
labels: ["component request"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [library](https://designme.dev) first: it may already be there under another name.
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: Run queue
    validations:
      required: true
  - type: dropdown
    id: set
    attributes:
      label: Set
      options:
        - Agent component
        - App basic
        - A new state for an existing component
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What it's for
      description: What a person does with it, and in what kind of product.
    validations:
      required: true
  - type: textarea
    id: states
    attributes:
      label: States and behaviour
      description: The states it needs (empty, loading, running, done, error) and what it does with the keyboard and on a phone.
  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Products that do something like this, with links or screenshots. We use standard patterns and don't copy other libraries' designs.
  - type: checkboxes
    id: help
    attributes:
      label: Building it
      options:
        - label: I'd like to build it myself (read CONTRIBUTING.md first)
