name: Bug report
description: Something in a component, the CLI or the site doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security issue, email hello@designme.agency instead (see SECURITY.md).
  - type: input
    id: component
    attributes:
      label: Component
      description: Its install name, as on its page (for example `status-pill`). Leave empty if it's the CLI or the site.
      placeholder: status-pill
  - type: dropdown
    id: version
    attributes:
      label: Version
      description: Where you see the bug.
      multiple: true
      options:
        - HTML, CSS and JavaScript (npx designme add)
        - React (--react)
        - Astro (--astro)
        - shadcn CLI
        - Theme bridge
        - designme.dev itself
    validations:
      required: true
  - type: checkboxes
    id: look
    attributes:
      label: Style and theme
      description: Where you see it. Tick all that apply.
      options:
        - label: Soft
        - label: Blueprint
        - label: Light
        - label: Dark
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npx designme add status-pill --react
        2. ...
  - type: input
    id: env
    attributes:
      label: Environment
      description: Browser, screen width, framework and its version, Node version for the CLI.
      placeholder: Chrome 140, 390px wide, Next.js 16, Node 22
