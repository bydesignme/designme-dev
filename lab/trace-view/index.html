<!doctype html>
<html lang="en" data-style="soft">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Trace view · Designme.dev lab</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<script>
/* the style and theme come from the address (?style=bp&theme=dark), then from what the site last used, then Soft light */
(function(){ var d = document.documentElement, q = new URLSearchParams(location.search), s = q.get('style'), t = q.get('theme');
  try { s = s || localStorage.getItem('dmui-style') || 'soft'; t = t || localStorage.getItem('dmui-theme'); } catch(e){}
  if (s === 'bp' || s === 'blueprint') d.removeAttribute('data-style'); else d.setAttribute('data-style', 'soft');
  d.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light'); })();
</script>
<style>
@font-face{font-family:Inter;font-style:normal;font-weight:400;font-display:swap;src:url(../../fonts/inter-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Inter;font-style:normal;font-weight:500;font-display:swap;src:url(../../fonts/inter-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
</style>
<link rel="stylesheet" href="../../components/assets/core.css">
<link rel="stylesheet" href="../flow/flow.css">
<link rel="stylesheet" href="trace.css">
</head>
<body>
<main class="lab">
  <header class="lab-h">
    <div>
      <h1>Trace view <span>· branch lines and one flow</span></h1>
      <p>The span tree takes the Agent tree's lines: each span branches off its parent's line, the flow runs from the root to the span that is running, bars fill in one accent tint and each span's state is its mark. Add ?fail to see a span fail.</p>
    </div>
    <div class="lab-ctl">
      <div class="seg2" id="sw-style" role="group" aria-label="Style"><button type="button" data-v="soft" aria-pressed="true">Soft</button><button type="button" data-v="bp" aria-pressed="false">Blueprint</button></div>
      <div class="seg2" id="sw-theme" role="group" aria-label="Theme"><button type="button" data-v="light" aria-pressed="true">Light</button><button type="button" data-v="dark" aria-pressed="false">Dark</button></div>
      <button type="button" class="lab-rp" id="replay" aria-label="Replay the run"><svg class="i s" aria-hidden="true"><use href="#i-refresh"/></svg>Replay</button>
    </div>
  </header>

  <div class="fr-st">
    <article class="card wide" id="c-trace-view" data-lab-c="trace-view"><div class="stage-in"></div><template><div class="trv panel dmf">
  <div class="trv-h"><div class="trv-ht"><b>Pricing research</b><span class="muted trv-st" aria-live="polite"></span></div><span class="trv-tot num">0.00s</span></div>
  <div class="trv-lg" role="list" aria-label="Spans by kind"></div>
  <div class="trv-ax" aria-hidden="true"><span>Span</span><span class="trv-sc"></span><span class="trv-tk">Tokens</span><span class="trv-ms">Time</span></div>
  <div class="trv-rows" role="group" aria-label="Spans"></div>
  <div class="fold shut trv-dt" inert><div><div class="trv-dc" role="region" aria-label="Span details"></div></div></div>
</div></template></article>
  </div>
</main>
<script src="../../components/assets/core.js"></script>
<script src="../flow/flow.js"></script>
<script src="trace.js"></script>
</body>
</html>
