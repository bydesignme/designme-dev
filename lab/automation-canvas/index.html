<!doctype html>
<html lang="en" data-style="soft">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Automation canvas · Designme.dev lab</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<script>
/* the style and theme come from the address (?style=bp&theme=dark), then from what the site last used, then Soft light */
(function(){ var d = document.documentElement, q = new URLSearchParams(location.search), s = q.get('style'), t = q.get('theme');
  try { s = s || localStorage.getItem('dmui-style') || 'soft'; t = t || localStorage.getItem('dmui-theme'); } catch(e){}
  if (s === 'bp' || s === 'blueprint') d.removeAttribute('data-style'); else d.setAttribute('data-style', 'soft');
  d.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light'); })();
</script>
<style>
@font-face{font-family:Inter;font-style:normal;font-weight:400;font-display:swap;src:url(../../fonts/inter-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Inter;font-style:normal;font-weight:500;font-display:swap;src:url(../../fonts/inter-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Inter;font-style:normal;font-weight:400;font-display:swap;src:url(../../fonts/inter-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:Inter;font-style:normal;font-weight:500;font-display:swap;src:url(../../fonts/inter-latin-ext-500-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
</style>
<link rel="stylesheet" href="../../components/assets/core.css">
<link rel="stylesheet" href="../flow/flow.css">
<link rel="stylesheet" href="canvas.css">
</head>
<body>
<main class="lab">
  <header class="lab-h">
    <div>
      <h1>Automation canvas <span>· Agent tree lines</span></h1>
      <p>The wires are square routes that follow the steps every frame and end on each step's mark. A test run tints each wire as it reaches it and runs the flow band into the step at work.</p>
    </div>
    <div class="lab-ctl">
      <div class="seg2" id="sw-style" role="group" aria-label="Style"><button type="button" data-v="soft" aria-pressed="true">Soft</button><button type="button" data-v="bp" aria-pressed="false">Blueprint</button></div>
      <div class="seg2" id="sw-theme" role="group" aria-label="Theme"><button type="button" data-v="light" aria-pressed="true">Light</button><button type="button" data-v="dark" aria-pressed="false">Dark</button></div>
      <button type="button" class="lab-rp" id="replay" aria-label="Replay the demo"><svg class="i s" aria-hidden="true"><use href="#i-refresh"/></svg>Replay</button>
    </div>
  </header>

  <div class="lab-st">
    <div class="card wide" data-c="automation-canvas"><div class="stage-in"></div><template><div class="acx dmf" data-reveal="flat">
  <div class="acx-top"><span class="acx-name">Weekly design QA</span><span class="tag ok acx-on">On</span></div>
  <div class="acx-cv" tabindex="0" role="group" aria-roledescription="canvas" aria-label="Automation canvas">
    <div class="acx-vp"><div class="acx-world"><div class="acx-nodes"></div></div><div class="acx-mq" hidden></div></div>
    <div class="acx-bar"><button class="pill primary sm acx-run">{play}Test run</button><span class="muted acx-st">Every Monday, 9:00</span></div>
    <div class="acx-zm" role="toolbar" aria-label="Zoom">
      <button class="acx-zb acx-zo" aria-label="Zoom out" data-tip="Zoom out" data-tip-k="−">{minus}</button>
      <button class="acx-zl num" aria-label="Zoom 100%, reset to 100%" data-tip="Zoom to 100%">100%</button>
      <button class="acx-zb acx-zi" aria-label="Zoom in" data-tip="Zoom in" data-tip-k="+">{plus}</button>
      <span class="acx-zs"></span>
      <button class="acx-zb acx-fit" aria-label="Fit to screen" data-tip="Fit to screen" data-tip-k="0">{fit}</button>
    </div>
    <span class="acx-sr">Drag the empty canvas or scroll to move around, and Control or Command with the scroll wheel, or a pinch, to zoom. With the canvas focused the arrow keys move the view, plus and minus zoom, and 0 or 1 fits it. Shift-click a step to add it to the selection, and Escape clears it.</span>
    <div class="pop acx-pop" role="dialog"></div>
    <div class="pop acx-pk" role="dialog" aria-label="Add a step">
      <div class="acx-q">{search}<input class="acx-qi" type="text" role="combobox" aria-expanded="true" aria-autocomplete="list" placeholder="Search steps" aria-label="Search steps" autocomplete="off" spellcheck="false"></div>
      <div class="acx-ls" role="listbox" aria-label="Steps"></div>
      <p class="acx-pd" aria-hidden="true"></p>
    </div>
  </div>
  <p class="acx-live" aria-live="polite"></p>
</div></template></div>
  </div>
</main>
<script src="../../components/assets/core.js"></script>
<script src="../flow/flow.js"></script>
<script src="canvas.js"></script>
</body>
</html>
