/* Designme shared core: tokens for Blueprint (default), Soft (data-style="soft") and Clean (data-style="clean"), on <html> or on any element around the components, light and dark (<html data-theme="dark">) */

.dm-held{display:flex;flex-direction:column;justify-content:center}

/* ---------- page shell ---------- */
:where([data-dm]) *{box-sizing:border-box}
:where([data-dm]) button,:where([data-dm]) input,:where([data-dm]) textarea,:where([data-dm]) select{font:inherit;color:inherit}
:where([data-dm]) button{background:none;border:0;padding:0;cursor:pointer}

:where([data-dm]) :focus-visible{outline:2px solid var(--dm-focus);outline-offset:2px;border-radius:calc(6px * var(--dm-rk-s,var(--dm-rk)))}

   that moves or acts is pressed; a ring drawn on the control's neighbour (a checkbox's box) goes with it */
[data-nofv]:focus-visible,[data-nofv]:focus-visible+*{outline:0}

/* Clean (owner, 17 Nov): the third style, a layer over Soft. The chrome is black, white and one neutral grey ramp: surfaces,
   text, hairlines, the primary button in ink (black in light, white in dark, its own --dm-btn tokens), secondary buttons,
   switchers, knobs and toggles. Data and status keep Soft's colours: the blue accent for data, selection and links, the
   chart palette, agents' own colours and pastel avatars, and the vivid status colours (a green tick, never a black one;
   no red fill behind an error, only its red words and mark). Hairline outlines with a 1px contact shadow and one short soft shadow on cards; off-white
   head and foot strips; everything fully round: chips, tags, icon tiles, bars, tracks,
   rows and fields are pills or circles (the radii scale with --dm-rk-s, --dm-rk-m and --dm-r-tiny), and cards, panels and popovers
   take 22px round corners (--dm-rk-l), never squircles. Buttons have depth inside their fill: a blurred light along the top,
   a soft shade along the bottom and a near-solid edge; checkboxes and tracks have a soft inner shadow. In dark only, a faint
   neutral glow sits around the white primary button, never around cards (owner, 18 Nov; an approved exception to "no glows": white
   or neutral only, never a hue). Status colour only on small marks. Motion is calm: ease-out quint, hovers 150ms, presses

  --dm-soft:#f3f3f3; --dm-soft-h:#ededed; --dm-soft-ring:inset 0 0 0 1px rgba(0,0,0,.06); --dm-dis:#a3a3a3;
  --dm-ghost:#ededed; --dm-ghost-2:#f4f4f4;
  --dm-ink:#0a0a0a; --dm-on-ink:#ffffff; --dm-on-btn:#ffffff;
  --dm-shadow:0 0 0 1px rgba(0,0,0,.07),0 1px 1px rgba(0,0,0,.04),0 2px 10px -4px rgba(0,0,0,.12);

  --dm-btn-1:#2a2a2a; --dm-btn-2:#0a0a0a;

  /* every button's edge is drawn inside it, so a primary and a secondary beside it are exactly the same height (owner, 18 Nov) */

     card's edge and from the strip's hairline, as they sit 16px from the card's sides, so a strip is 60px plus its hairline.

     come and go */
  --dm-strip-y:16px;

// the composer's words: the first message is there from the start; the second is typed in

// ---------- render one moment ----------

  if (rp) rip.style.transform = `translate(${(rp[1].x).toFixed(2)}px,${(rp[1].y).toFixed(2)}px) scale(${(.4 + 1.2 * eOutCubic(rp[0])).toFixed(3)})`;

  // ---------- the camera: in on the panel while it is open, back out to the chat when it folds ----------
  const zi = eInOutCubic(seg(t, B.camIn, B.camInD)), zo = eInOutCubic(seg(t, B.camOut, B.camOutD));
  const z = zi * (1 - zo);
  const Sc = lerp(FMT.base, ZM, z) + .025 * hit(th, .05) * (1 - zo);
  const shake = 1.8 * hit(th, .045);
  const fxp = lerp(W / 2, CX + 170, z), fyp = lerp(H / 2 + FMT.dy, PILL_B - H1 / 2, z);
  world.style.transform = `translate(${(W / 2 - fxp * Sc).toFixed(2)}px,${(H / 2 - fyp * Sc + shake).toFixed(2)}px) scale(${Sc.toFixed(4)})`;
}

// ---------- the landing's mark ----------
const fx = $('#fx'), NS = 'http://www.w3.org/2000/svg';
const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('width', 1); svg.setAttribute('height', 1); fx.appendChild(svg);
const clines = [0, 1, 2].map(i => {
  const p = document.createElementNS(NS, 'line'); p.setAttribute('class', 'cl'); svg.appendChild(p);
  return { p, x0: 4 + i * 5, dx: 8 + i * 7, h: [11, 15, 9][i], delay: i * .03 };
});

window.renderAt = renderAt;
window.TIMING = { T, FPS:60 };
window.FORMAT = { W, H, out: FMT.out, scale: FMT.out[0] / W };
const fit = () => { if (document.body.classList.contains('render')) return; const s = Math.min(innerWidth / W, (innerHeight - 40) / H); stage.style.transform = `scale(${s}) translate(-50%,-50%)`; };
const R = new URLSearchParams(location.search).has('render');
if (R) document.body.classList.add('render');
else { fit(); addEventListener('resize', fit); }
const here = '?v=' + window.CUT + (F45 ? '&f=4x5' : '');
document.querySelectorAll('.cap a').forEach(a => { if (a.getAttribute('href') === here) a.setAttribute('aria-current', 'page'); });
window.assetsReady = Promise.all([document.fonts.ready, ...[...document.fonts].map(f => f.load().catch(() => {}))]).then(() => { measureLayout(); renderAt(0); return true; });
if (!R) assetsReady.then(() => {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches){ renderAt(11.5); return; }
  let t0 = null; const loop = ts => { t0 ??= ts; renderAt((ts - t0) / 1000); requestAnimationFrame(loop); }; requestAnimationFrame(loop);
});
})();
</script>
