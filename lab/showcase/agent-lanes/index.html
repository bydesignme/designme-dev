/* ---------- page shell ---------- */
:where([data-dm]) *{box-sizing:border-box}
:where([data-dm]) button,:where([data-dm]) input,:where([data-dm]) textarea,:where([data-dm]) select{font:inherit;color:inherit}
:where([data-dm]) button{background:none;border:0;padding:0;cursor:pointer}
/* one weight for emphasis: medium, never bold */
:where([data-dm]) b,:where([data-dm]) strong{font-weight:500}
:where([data-dm]) :focus-visible{outline:2px solid var(--dm-focus);outline-offset:2px;border-radius:calc(6px * var(--dm-rk-s,var(--dm-rk)))}
/* a control pressed with a pointer, or a button that got the focus back after a click (closePops), keeps no ring until a key
   that moves or acts is pressed; a ring drawn on the control's neighbour (a checkbox's box) goes with it */
[data-nofv]:focus-visible,[data-nofv]:focus-visible+*{outline:0}
/* a field shows the focus with its own edge, which steps up to --dm-field-line-strong, so it never takes the ring as well */
:where([data-dm]) :focus-visible:is(input:not([type="checkbox"],[type="radio"],[type="range"],[type="file"],[type="button"],[type="submit"],[type="reset"]),textarea,select,[contenteditable]:not([contenteditable="false"])){outline:0}/* ---------- icons ---------- */
.dm-i{width:16px;height:16px;flex:none;display:inline-block;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dm-i.dm-s{width:14px;height:14px}.dm-i.dm-xs{width:12px;height:12px}.dm-i.dm-l{width:18px;height:18px}
.dm-brand{width:16px;height:16px;display:block;flex:none}

/* ---------- primitives ---------- */
.dm-mono{font-family:var(--dm-mono)}

   chart palette, agents' own colours and pastel avatars, and the vivid status colours (a green tick, never a black one;
   no red fill behind an error, only its red words and mark). Hairline outlines with a 1px contact shadow and one short soft shadow on cards; off-white
   head and foot strips; everything fully round: chips, tags, icon tiles, bars, tracks,
   rows and fields are pills or circles (the radii scale with --dm-rk-s, --dm-rk-m and --dm-r-tiny), and cards, panels and popovers
   take 22px round corners (--dm-rk-l), never squircles. Buttons have depth inside their fill: a blurred light along the top,
   a soft shade along the bottom and a near-solid edge; checkboxes and tracks have a soft inner shadow. In dark only, a faint
   neutral glow sits around the white primary button, never around cards (owner, 18 Nov; an approved exception to "no glows": white
   or neutral only, never a hue). Status colour only on small marks. Motion is calm: ease-out quint, hovers 150ms, presses

  --dm-soft:#f3f3f3; --dm-soft-h:#ededed; --dm-soft-ring:inset 0 0 0 1px rgba(0,0,0,.06); --dm-dis:#a3a3a3;
  --dm-ghost:#ededed; --dm-ghost-2:#f4f4f4;
  --dm-ink:#0a0a0a; --dm-on-ink:#ffffff; --dm-on-btn:#ffffff;
  --dm-shadow:0 0 0 1px rgba(0,0,0,.07),0 1px 1px rgba(0,0,0,.04),0 2px 10px -4px rgba(0,0,0,.12);

  --dm-shadow-toast:var(--dm-shadow-pop); --dm-shadow-lift:var(--dm-shadow-pop);

  /* every button's edge is drawn inside it, so a primary and a secondary beside it are exactly the same height (owner, 18 Nov) */
  /* secondary buttons and dropdown triggers are flat (owner, 18 Nov): a hairline border and a light fill, no glow, shade or

     controls (buttons, chips, tags, toggles, switchers), avatars and dots, which have their own pill tokens (--dm-r-pill,

  M.cardPad = card.offsetHeight - hd.offsetHeight - rows.offsetHeight;
  M.ibTop = ib.offsetHeight - ibody.offsetHeight;      // the inbox's padding and head
  M.TW = R0.tr.offsetWidth;
  M.w1 = t1.offsetWidth; t2.style.position = 'static'; M.w2 = t2.offsetWidth; t2.style.position = '';
  M.avOff = offIn(R0.av, R0.el);
  SAV.style.left = M.avOff.x + 'px'; SAV.style.top = M.avOff.y + 'px';
  for (const l of L) l.el.dataset.s = 'queued';
  window.LAYOUT = M;
}

// ---------- one frame ----------
const show = (el, o) => { el.style.opacity = o >= .999 ? '' : o.toFixed(3); el.style.visibility = o <= .001 ? 'hidden' : ''; };
// the old words leave (fade, a little blur, 3px down) and the new arrive, as the component's Swap does
const swapStyle = (el, o, dir) => { show(el, o); const b = (1 - o) * 2.5; el.style.filter = o < .999 && o > .001 ? `blur(${b.toFixed(2)}px)` : ''; el.style.transform = o < .999 ? `translateY(${((1 - o) * 3 * dir).toFixed(2)}px)` : ''; };
const swapList = (list, t, els, d = .2) => {
  // list: [[time, key], ...]; each key's element is shown from its time, crossfading over d
  const keys = [...new Set(list.map(x => x[1]))];
  for (const k of keys){ let o = 0;
    for (let i = 0; i < list.length; i++){ const [a, kk] = list[i], nx = list[i + 1];
      if (kk !== k) continue; const inn = i === 0 ? 1 : fade(t, a + d * .45, d * .55), outn = nx ? 1 - fade(t, nx[0], d * .45) : 1; o = Math.max(o, Math.min(inn, outn)); }
    swapStyle(els[k], o, 1); }
};

function renderAt(tt){
  const t = ((tt % T) + T) % T;
  const sh = t * 1000;

  // ----- the lanes -----
  let total = 0;
  for (const [j, l] of L.entries()){
    const tg = at(l.tags, t)[1], p = stepsAt(l, t), live = tg === 'working';
    l.el.dataset.s = tg === 'waiting' ? 'waiting' : tg;
    total += doneSteps(l, t);
    // the track: finished steps solid, the one in hand filling with its light running along it
    l.parts.forEach((e, i) => {
      const on = p >= i + 1 - 1e-6, run = !on && live && i === Math.floor(p);
      e.classList.toggle('dm-on', on); e.classList.toggle('dm-run', run);
      e.style.setProperty('--dm-p', run ? (p - i).toFixed(4) : on ? '1' : '0');
      if (run) e.style.setProperty('--sx', (100 - 250 * (((t + j * .37) % 1.6) / 1.6)).toFixed(2) + '%');
    });
    // words and tag
    swapList(l.acts.map(([a, s]) => [a, s]), t, l.txt);
    for (const [a, s, lv] of l.acts){ const e = l.txt[s]; e.classList.toggle('dm-shim', !!lv && at(l.acts, t)[1] === s && live);
      if (lv) e.style.backgroundPosition = (100 - 260 * ((t % 2.2) / 2.2)).toFixed(2) + '% 0'; }
    l.a.classList.toggle('dm-live', live);
    swapList(l.tags, t, l.tagEl, .18);
    if (l.spin) l.spin.style.transform = `rotate(${(sh * .45) % 360}deg)`;
    // the badge: lifted and breathing while its agent works; it squashes when a mark lands on it or a hand-off reaches it
    const b = (1 - Math.cos(2 * Math.PI * t / 2.4)) / 2;
    l.av.style.boxShadow = live ? `0 0 0 1px color-mix(in srgb,var(--dm-c) 22%,transparent),0 0 0 ${(1 + 4 * b).toFixed(2)}px color-mix(in srgb,var(--dm-fg) ${(6 * b).toFixed(2)}%,transparent)` : '';
    let [sx, sy] = squash(t, LAND[j]);
    if (j === 1){ const [a, c] = squash(t, PING, .8); sx *= a; sy *= c; }
    l.av.style.transform = sx !== 1 ? `scale(${sx.toFixed(4)},${sy.toFixed(4)})` : '';
  }
  // the head
  const fin = t >= B.fin;
  card.classList.toggle('dm-fin', fin);
  const hf = fade(t, B.fin, .2);
  swapStyle(t1, 1 - fade(t, B.fin, .09), 1); swapStyle(t2, fade(t, B.fin + .09, .11), 1);
  ttl.style.width = lerp(M.w1, M.w2, E.reflow(seg(t, B.fin + .02, .26))).toFixed(2) + 'px';
  show(icU, 1 - hf); show(icO, hf); icO.style.transform = hf < 1 ? `scale(${(.6 + .4 * E.settle(hf)).toFixed(3)})` : '';
  clk.textContent = clock(clamp((t - LAND[0]) * K, 0, 20));
  cnt.textContent = `${total} of 9 steps`;
  show(pause, 1 - fade(t, B.fin, .16));
  hd.style.height = lerp(M.headH1, M.headH0, E.reflow(seg(t, B.fin + .12, .28))).toFixed(2) + 'px';

  // the hand-off: the line opens, the Researcher's words slide down into it, then the relay line draws down to the Designer
  const ho = E.reflow(seg(t, B.handOpen, .34)) * (1 - E.reflow(seg(t, B.handShut, .34)));
  HF.style.height = (M.hfH * ho).toFixed(2) + 'px';
  const hw = E.move(seg(t, B.handOpen + .04, .36));
  HAND.style.transform = `translateY(${((1 - hw) * -12).toFixed(2)}px)`;
  HAND.style.opacity = (fade(t, B.handOpen + .1, .18) * (1 - fade(t, B.handShut, .16))).toFixed(3);
  const lit = t >= PING;
  L[0].el.classList.toggle('dm-sent', lit); L[1].el.classList.toggle('dm-got', lit); HF.classList.toggle('dm-lit', lit);
  const dr = E.sine(seg(t, B.relay, B.relayD));
  if (dr > 0){
    const a = offIn(L[0].av, rows), c = offIn(L[1].av, rows);
    const y0 = a.y + L[0].av.offsetHeight + 4 + (L[0].el.style.transform ? 0 : 0), y1 = c.y - 4;
    PK.style.top = y0.toFixed(2) + 'px'; PK.style.height = Math.max(0, y1 - y0).toFixed(2) + 'px';
    PK.style.transform = dr < 1 ? `scaleY(${dr.toFixed(4)})` : ''; PK.style.visibility = '';
  } else PK.style.visibility = 'hidden';
  // the Designer's badge rings once as the relay reaches it
  const pq = seg(t, PING, .9);
  L[1].av.style.setProperty('--pr', (pq > 0 && pq < 1 ? 12 * E.settle(pq) : 0).toFixed(2) + 'px');
  L[1].av.style.setProperty('--pa', (pq > 0 && pq < 1 ? 20 * (1 - pq) : 0).toFixed(2) + '%');

  // ----- the fold: the lanes break apart and stream into one summary -----
  const F = B.fold;
  const words = 1 - fade(t, F, .15);                    // lanes 2 and 3 let go of their words and tags first
  const rl = 1 - fade(t, F, .18);
  rows.style.setProperty('--rl', rl.toFixed(3));
  PK.style.opacity = rl.toFixed(3);
  const ARR = [0, F + .5, F + .65];                     // when each lane's badge and steps arrive in the summary
  const fly = [0, E.move(seg(t, F + .1, .4)), E.move(seg(t, F + .25, .4))];
  const comp = [E.reflow(seg(t, F + .05, .4)), fly[1], fly[2]];
  const w3 = (M.TW - 6) / 3, w9 = (M.TW - 24) / 9;
  for (const [j, l] of L.entries()){
    if (j){ show(l.who, words); show(l.st, words);
      const dy = (l.el.offsetTop - L[0].el.offsetTop) * fly[j];
      l.el.style.transform = dy ? `translateY(${(-dy).toFixed(2)}px)` : '';
      // its badge fades into the summary's as it arrives
      l.av.style.opacity = (1 - fade(t, ARR[j] - .06, .08)).toFixed(3);
      if (t > ARR[j]) l.av.style.visibility = 'hidden'; else l.av.style.visibility = '';
    }
    const e = comp[j];
    l.parts.forEach((p, k) => {
      if (e <= 0){ p.style.flex = ''; p.style.width = ''; p.style.transform = ''; return; }
      const w = lerp(w3, w9, e), x = lerp(k * (w3 + 3), (3 * j + k) * (w9 + 3), e);
      p.style.flex = 'none'; p.style.width = w.toFixed(3) + 'px'; p.style.transform = `translateX(${(x - k * (w + 3)).toFixed(3)}px)`;
    });
  }
  // the rows close up round the one lane left, and the card with them
  const rc = E.reflow(seg(t, F + .15, .55));
  rows.style.height = rc > 0 ? lerp(M.rowsH, M.laneH, rc).toFixed(2) + 'px' : '';
  // the Researcher's lane becomes the summary: its name, its badge and its words; each lane that arrives adds its result
  // (the old words leave before the new arrive, as Swap does, so the two never sit on top of each other)
  const smOut = fade(t, F + .05, .09), sm = fade(t, F + .14, .11);
  swapStyle(R0.nm.children[0], 1 - smOut, 1); swapStyle(SNM, sm, 1);
  if (t >= F){ swapStyle(R0.txt['Wrote 3 notes'], 1 - smOut, 1); }
  swapStyle(SA, sm, 1);
  swapStyle(SP2, fade(t, ARR[1], .13), 1); swapStyle(SP3, fade(t, ARR[2], .13), 1);
  const sb = fade(t, F + .05, .18);
  show(SAV, sb);
  let [qx, qy] = [1, 1];
  for (const a of [ARR[1], ARR[2]]){ const [x, y] = squash(t, a, .7); qx *= x; qy *= y; }
  const sIn = sb < 1 ? .7 + .3 * E.settle(sb) : 1;
  SAV.style.transform = `scale(${(sIn * qx).toFixed(4)},${(sIn * qy).toFixed(4)})`;
  // the finishing light runs once along the nine steps
  const gq = seg(t, B.gleam, B.gleamD);
  CLIP.style.visibility = gq > 0 && gq < 1 ? '' : 'hidden';
  GLEAM.style.transform = `translateX(${(-40 + (M.TW + 40) * E.sine(gq)).toFixed(2)}px)`;

  // ----- the queue -----
  const P = inboxAt(t);
  ibody.style.height = P.H.toFixed(2) + 'px';
  GH.forEach((h, k) => { const s = P.h[k]; h.e.style.transform = `translateY(${s.y.toFixed(2)}px)`; show(h.e, s.o); if (s.n) h.n.textContent = s.n; });
  for (const r of RUNS){
    const y = P.r[r.i], g = groupOf(r, t);
    // a press as its mark is picked up
    const pr = seg(t, B.disp[r.i] - .08, .16), ps = pr > 0 && pr < 1 ? 1 - .03 * Math.sin(Math.PI * pr) : 1;
    r.e.style.transform = `translateY(${y.toFixed(2)}px)` + (ps !== 1 ? ` scale(${ps.toFixed(4)})` : '');
    swapList([[0, 0], [B.disp[r.i] + .1, 1], [r.l.end + .15, 2]], t, r.det);
    swapList([[0, 'n'], [B.disp[r.i] + .1, 'r'], [r.l.end + .15, 'd']], t, { n:document.createElement('i'), r:r.run, d:r.dn }, .18);
    r.spin.style.transform = `rotate(${(sh * .45) % 360}deg)`;
    r.clk.textContent = clock(clamp((t - LAND[r.i]) * K, 0, 99));   // (its clock runs from when its agent starts, on the lanes' clock)
  }

  // ----- where everything sits: both cards centred together in the frame -----
  const ibH = M.ibTop + P.H, cardH = hd.offsetHeight + rows.offsetHeight + M.cardPad;
  const tot = ibH + GAP + cardH, top = H / 2 - tot / 2;
  iw.style.top = top.toFixed(2) + 'px'; cw.style.top = (top + ibH + GAP).toFixed(2) + 'px';

  // the marks in flight: each leaves its run's tile, swings out round the cards' left edge and lands on its lane's badge
  for (const r of RUNS){
    const e = TOK[r.i], q = t - B.disp[r.i];
    if (q < 0 || q > B.fly + .2){ e.style.visibility = 'hidden'; continue; }
    e.style.visibility = '';
    const a0 = { x: 180 + 16 + 14, y: top + M.ibTop + P.r[r.i] + 22 };
    const lb = offIn(r.l.av, cw); const a3 = { x: cw.offsetLeft + lb.x + 17, y: top + ibH + GAP + lb.y + 17 };
    const lift = E.settle(seg(q, 0, .12)), s = E.move(seg(q, .1, B.fly));
    const c1 = { x: a0.x - 120, y: a0.y + 4 }, c2 = { x: a3.x - 105, y: a3.y - 16 };
    const u = 1 - s, X = u * u * u * a0.x + 3 * u * u * s * c1.x + 3 * u * s * s * c2.x + s * s * s * a3.x, Y = u * u * u * a0.y + 3 * u * u * s * c1.y + 3 * u * s * s * c2.y + s * s * s * a3.y;
    const sc = lerp(1 + .06 * lift, 34 / 28, E.settle(seg(q, .1 + B.fly * .55, B.fly * .45)));
    const rot = -12 * Math.sin(Math.PI * clamp(s));
    e.style.transform = `translate(${X.toFixed(2)}px,${Y.toFixed(2)}px) rotate(${rot.toFixed(2)}deg) scale(${sc.toFixed(4)})`;
    e.style.opacity = (fade(q, 0, .06) * (1 - fade(q, .1 + B.fly, .07))).toFixed(3);
    e.style.borderRadius = '';
  }

  // ----- entrance and exit -----
  const pieces = [[iw, 0], [ibh, .05], [GH[0].e, .1], ...RUNS.map((r, i) => [r.e, .15 + (2 - i) * .05]), [cw, .07], [hd, .12], ...L.map((l, i) => [l.el, .17 + i * .05])];
  for (const [el, d] of pieces){
    const ki = E.settle(seg(t, B.in + d, .55)), ko = E.exit(seg(t, B.out + d * .6, .3));
    const card0 = el === iw || el === cw;
    const op = ki * (1 - ko);
    if (card0){ el.style.opacity = op.toFixed(3); el.style.transform = op < 1 ? `translateY(${((1 - ki) * 8 + ko * (el === iw ? -14 : 14)).toFixed(2)}px) scale(${(.98 + .02 * ki).toFixed(4)})` : ''; }
    else if (ki < 1){ el.style.opacity = ki.toFixed(3); el.style.translate = `0 ${((1 - ki) * 6).toFixed(2)}px`; }
    else { el.style.opacity = ''; el.style.translate = ''; }
  }
  // the group heading's own fade (it shares the entrance)
  if (t > B.in + .7) show(GH[0].e, P.h[0].o);

  // ----- the camera: rests at 1.0 on both cards, pushes in on the lanes for the race and again for the finish -----
  const zA = E.camera(seg(t, B.camIn, B.camInD)) * (1 - E.camera(seg(t, B.camOut, B.camOutD)));
  const zB = E.camera(seg(t, B.camIn2, B.camIn2D)) * (1 - E.camera(seg(t, B.camOut2, B.camOut2D)));
  const z = Math.max(zA, zB);
  const kick = (a, amp) => { const q = t - a; return q < 0 ? 0 : q < .05 ? amp * q / .05 : amp * (1 - E.settle(clamp((q - .05) / .25))); };
  const S = Math.exp(lerp(0, Math.log(1.3), z)) * (1 + kick(PING, .05) + kick(ARR[1], .025) + kick(ARR[2], .03));
  const lcx = 400, lcy = top + ibH + GAP + cardH / 2;
  // during the race the frame sits on the lanes' upper part, where the hand-off happens
  const fy = lerp(H / 2, lerp(lcy, lcy - 10, zA), z);
  world.style.transform = `translate(${(W / 2 - lcx * S).toFixed(2)}px,${(H / 2 - fy * S).toFixed(2)}px) scale(${S.toFixed(4)})`;
}

window.renderAt = renderAt;
window.TIMING = { T, FPS:60 };
window.FORMAT = { W, H, out:[1600, 1200], scale:2 };
const fit = () => { if (document.body.classList.contains('render')) return; const s = Math.min(innerWidth / W, (innerHeight - 40) / H); stage.style.transform = `scale(${s}) translate(-50%,-50%)`; };
const R = new URLSearchParams(location.search).has('render');
if (R) document.body.classList.add('render');
else { fit(); addEventListener('resize', fit); }
window.assetsReady = Promise.all([document.fonts.ready, ...[...document.fonts].map(f => f.load().catch(() => {}))]).then(() => { measure(); renderAt(0); return true; });
if (!R) assetsReady.then(() => {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches){ renderAt(9.4); return; }
  let t0 = null; const loop = ts => { t0 ??= ts; renderAt(((ts - t0) / 1000) % T); requestAnimationFrame(loop); }; requestAnimationFrame(loop);
});
})();
</script>
</body>
