<!doctype html>
<html lang="en" data-style="soft">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Agent tree, angled · Designme.dev lab</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<script>
/* the style and theme come from the address (?style=bp&theme=dark), then from what the site last used */
(function(){ var d = document.documentElement, q = new URLSearchParams(location.search), s = q.get('style'), t = q.get('theme');
  try { s = s || localStorage.getItem('dmui-style') || 'soft'; t = t || localStorage.getItem('dmui-theme'); } catch(e){}
  if (s === 'bp') d.removeAttribute('data-style'); else d.setAttribute('data-style', 'soft');
  d.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light'); })();
</script>
<link rel="stylesheet" href="../../components/assets/core.css">
<link rel="stylesheet" href="tree.css">
</head>
<body>
<main class="atx v-a" data-v="a" aria-label="Agent tree, a run in progress">
  <header class="atx-h"><div class="atx-ey"><span class="live"></span><b>Live run</b></div><h1 class="atx-t">Redesign the pricing page</h1><div class="atx-m">Starting</div></header>
  <div class="atx-tree" role="tree" aria-label="Agents"></div>
</main>
<script src="marks.js"></script>
<script src="tree.js"></script>
</body>
</html>
