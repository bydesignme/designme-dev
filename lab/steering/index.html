<script>
/* the style and theme come from the address (?style=bp&theme=dark), then from what the site last used, then Soft light */
(function(){ var d = document.documentElement, q = new URLSearchParams(location.search), s = q.get('style'), t = q.get('theme');
  try { s = s || localStorage.getItem('dmui-style') || 'soft'; t = t || localStorage.getItem('dmui-theme'); } catch(e){ s = s || 'soft'; }
  if (s === 'bp' || s === 'blueprint') d.removeAttribute('data-style'); else d.setAttribute('data-style', 'soft');
  d.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light'); })();
</script>
</script>

/* ---------- tokens ----------
   components/assets/core.css ships the install's prefixed tokens (--dm-*). The component (steering.css) is written with the
   short names the site's source (soft-2/index.html) uses, so it can move there as it is; on this page they point at the core's */
:root{
  --page:var(--dm-page); --stage:var(--dm-stage); --surface:var(--dm-surface);
  --fg:var(--dm-fg); --fg2:var(--dm-fg2); --muted:var(--dm-muted); --faint:var(--dm-faint); --rail:var(--dm-rail); --line:var(--dm-line); --line-strong:var(--dm-line-strong);
  --chip:var(--dm-chip); --hover:var(--dm-hover); --row:var(--dm-row); --grid:var(--dm-grid);
  --accent:var(--dm-accent); --on-accent:var(--dm-on-accent); --accent-mark:var(--dm-accent-mark);
  --ok:var(--dm-ok); --ok-bg:var(--dm-ok-bg); --ok-mark:var(--dm-ok-mark); --warn:var(--dm-warn); --warn-bg:var(--dm-warn-bg); --warn-mark:var(--dm-warn-mark);
  --rk:var(--dm-rk); --r-card:var(--dm-r-card); --r-in:var(--dm-r-in); --r-xs:var(--dm-r-xs); --r-pill:var(--dm-r-pill); --r-field:var(--dm-r-field); --r-field-sq:var(--dm-r-field-sq);
  --field-h:var(--dm-field-h); --field-line:var(--dm-field-line); --field-line-strong:var(--dm-field-line-strong);
  --dis:var(--dm-dis); --dis-fill:var(--dm-dis-fill); --dis-hatch:var(--dm-dis-hatch); --soft-ring:var(--dm-soft-ring);
  --shadow:var(--dm-shadow); --shadow-pop:var(--dm-shadow-pop);
  --s-1:var(--dm-s-1); --s-2:var(--dm-s-2); --s-3:var(--dm-s-3); --s-4:var(--dm-s-4); --s-5:var(--dm-s-5); --s-6:var(--dm-s-6); --s-8:var(--dm-s-8);
  --sans:var(--dm-sans); --ease:var(--dm-ease); --t-fast:var(--dm-t-fast);
}
/* ---------- the page ---------- */
html,body{margin:0;background:var(--page)}
body{font-family:var(--sans);font-size:14px;line-height:1.5;color:var(--fg);-webkit-font-smoothing:antialiased}
:where(.lab) button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:where(.lab) :focus-visible{outline:2px solid var(--line-strong);outline-offset:2px;border-radius:6px}
.lab{max-width:760px;margin:0 auto;padding:var(--s-8) var(--s-6) 72px;box-sizing:border-box}
.lab-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:var(--s-4) var(--s-6);padding-bottom:var(--s-5)}
.lab-h h1{margin:0;font-size:14px;font-weight:500;line-height:1.4}
.lab-h h1 span{color:var(--muted);font-weight:400}
.lab-h p{margin:var(--s-1) 0 0;max-width:520px;font-size:13px;line-height:1.55;color:var(--muted);text-wrap:pretty}
.lab-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-2)}
.lab-ctl .seg2 button{color:var(--muted)}
.lab-ctl .seg2 button[aria-pressed="true"]{color:var(--fg)}
.lab-rp{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:var(--r-pill);background:var(--chip);font-size:12.5px;color:var(--fg);transition:background var(--t-fast)}
.lab-rp:hover{background:var(--hover)}
.lab-rp .i{color:var(--fg2)}
/* the stage: the component sits centred in it at every height */
.fr-st{display:flex;align-items:center;justify-content:center;min-height:680px;padding:var(--s-6) var(--s-4);box-sizing:border-box;border-radius:var(--r-card);background:var(--stage);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--line) 50%,transparent)}
.fr-st>.card{width:100%;display:flex;justify-content:center}
.fr-st .stage-in{width:100%;display:flex;justify-content:center}
:root:not([data-style="soft"]) .fr-st{border-radius:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px}
:root:not([data-style="soft"]) :is(.lab-rp,.lab-ctl .seg2,.lab-ctl .seg2 *){border-radius:0}
:root:not([data-style="soft"]) .lab-h h1{font-size:12px;letter-spacing:.04em;text-transform:uppercase}
@media (max-width:640px){.lab{padding:var(--s-6) var(--s-4) 56px}.fr-st{padding:var(--s-4) var(--s-3);min-height:660px}}
</style>

<body>
<main class="lab">
  <header class="lab-h">
    <div>
      <h1>Steering <span>· flow lines</span></h1>
      <p>The agent's steps hang off one rail, tinted to the step in progress, with the band running down to it. Your message joins the rail from below; when it lands, the band carries it up to the step it changes, and that step swaps at once.</p>
    </div>
    <div class="lab-ctl">
      <div class="seg2" id="sw-style" role="group" aria-label="Style"><button type="button" data-v="soft" aria-pressed="true">Soft</button><button type="button" data-v="bp" aria-pressed="false">Blueprint</button></div>
      <div class="seg2" id="sw-theme" role="group" aria-label="Theme"><button type="button" data-v="light" aria-pressed="true">Light</button><button type="button" data-v="dark" aria-pressed="false">Dark</button></div>
      <button type="button" class="lab-rp" id="replay" aria-label="Replay Steering"><svg class="i s" aria-hidden="true"><use href="#i-refresh"/></svg>Replay</button>
    </div>
  </header>
  <div class="fr-st">
    <div class="card" id="steering"><div class="stage-in"></div><template><div class="ste panel dmf" data-reveal="flat">
  <div class="ste-h"><span class="dmf-g" aria-hidden="true"></span><div class="ste-ht"><b>Redesign the pricing page</b><span class="muted ste-st"><span class="m" aria-live="polite">Step 2 of 4</span> · <span class="num ck">0:00</span></span></div></div>
  <ol class="ste-steps" aria-label="Steps"></ol>
  <div class="ste-log" aria-live="polite"></div>
  <form class="ste-box"><input placeholder="Steer the agent while it works" aria-label="Message the agent" spellcheck="false" autocomplete="off"><button class="ste-go" aria-label="Send" disabled>{up}</button></form>
</div></template></div>
  </div>
</main>
<script src="../../components/assets/core.js"></script>
<script src="../flow/flow.js"></script>
<script src="steering.js"></script>
</body>
</html>
