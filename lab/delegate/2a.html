<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Switchboard · Hand-off lab 2a · Designme.dev lab</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<script>
/* style and theme: ?style=bp|soft|clean&theme=light|dark, else what the site stored, else the site's default (light opens in
   Soft, dark in Blueprint). Blueprint is no data-style attribute, as core.css expects */
(function(){
  var q = new URLSearchParams(location.search), d = document.documentElement, s, t;
  try { s = q.get('style') || localStorage.getItem('dmui-style'); t = q.get('theme') || localStorage.getItem('dmui-theme'); } catch(e){}
  if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  if (s === 'blueprint') s = 'bp';
  if (s !== 'bp' && s !== 'soft' && s !== 'clean') s = t === 'dark' ? 'bp' : 'soft';
  d.setAttribute('data-theme', t); if (s === 'bp') d.removeAttribute('data-style'); else d.setAttribute('data-style', s);
  try { if (q.get('style')) localStorage.setItem('dmui-style', s); if (q.get('theme')) localStorage.setItem('dmui-theme', t); } catch(e){}
})();
</script>
<link rel="stylesheet" href="assets/core.css">
<style>
@font-face{font-family:"Inter";font-style:normal;font-weight:400;font-display:swap;src:url(../../fonts/inter-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-style:normal;font-weight:500;font-display:swap;src:url(../../fonts/inter-latin-500-normal.woff2) format("woff2")}
html,body{margin:0}
body{background:var(--dm-page);color:var(--dm-fg);font-family:var(--dm-sans);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
*{box-sizing:border-box}

/* ---------- the lab page around the component ---------- */
.dl2a-top{max-width:1040px;margin:0 auto;padding:24px 16px 16px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px}
.dl2a-intro{flex:1 1 360px;min-width:0}
.dl2a-intro h1{margin:0;font-size:14px;font-weight:500;line-height:20px}
.dl2a-intro h1 span{color:var(--dm-muted);font-weight:400}
.dl2a-intro p{margin:4px 0 0;font-size:13px;line-height:20px;color:var(--dm-muted);max-width:620px}
.dl2a-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.dl2a-seg{display:inline-flex;padding:2px;border-radius:999px;background:var(--dm-chip)}
.dl2a-seg button,.dl2a-rp{font:inherit;font-size:12.5px;font-weight:500;height:28px;padding:0 12px;border:0;border-radius:999px;background:none;color:var(--dm-fg2);cursor:pointer;transition:background-color .2s,color .2s}
.dl2a-seg button:hover{color:var(--dm-fg)}
.dl2a-seg button[aria-pressed="true"]{background:var(--dm-surface);color:var(--dm-fg);box-shadow:0 0 0 1px color-mix(in srgb,var(--dm-line) 50%,transparent),0 1px 2px rgba(0,0,0,.06)}
.dl2a-rp{display:inline-flex;align-items:center;gap:6px;background:var(--dm-surface);color:var(--dm-fg);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--dm-line) 50%,transparent);height:32px}
.dl2a-rp:hover{background:var(--dm-row)}
:is(.dl2a-seg button,.dl2a-rp):focus-visible{outline:2px solid var(--dm-focus);outline-offset:2px}
:root:not([data-style]) :is(.dl2a-seg,.dl2a-seg button,.dl2a-rp){border-radius:0}
.dl2a-stage{max-width:1040px;margin:0 auto 48px;padding:56px 16px;min-height:680px;display:flex;align-items:center;justify-content:center;background:var(--dm-stage);border-radius:24px;box-shadow:0 0 0 1px color-mix(in srgb,var(--dm-line) 50%,transparent)}
:root:not([data-style]) .dl2a-stage{border-radius:0;background-image:linear-gradient(var(--dm-grid) 1px,transparent 1px),linear-gradient(90deg,var(--dm-grid) 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px}
@media (max-width:720px){.dl2a-stage{border-radius:0;box-shadow:none;padding:32px 16px;min-height:0}}
.dl2a-card{width:100%;display:flex;justify-content:center}
.dl2a-card>.stage-in{max-width:760px}

/* ---------- Switchboard ---------- */
.dl2a{--ag:var(--dm-av-b);--ag-ink:var(--dm-av-b-ink);width:100%;padding:16px;display:flex;flex-direction:column;gap:16px;font-size:13px;line-height:18px;color:var(--dm-fg);container-type:inline-size;touch-action:pan-y}
.dl2a.growing>.dm-grow{gap:16px}
.dl2a .num{font-variant-numeric:tabular-nums}
.dl2a-h,.dl2a-f{display:flex;align-items:center;gap:8px;min-height:28px}
.dl2a-hi{width:28px;height:28px;border-radius:calc(8px * var(--dm-rk-m,var(--dm-rk)));display:grid;place-items:center;background:var(--dm-chip);color:var(--dm-fg2);flex:none}
.dl2a-hw{display:flex;align-items:baseline;gap:8px;min-width:0}
.dl2a-ttl{font-size:14px;font-weight:500;white-space:nowrap}
.dl2a-meta{font-size:12.5px;color:var(--dm-muted);white-space:nowrap}
.dl2a-sp{flex:1}
.dl2a-f{padding-top:16px;border-top:1px solid color-mix(in srgb,var(--dm-line) 50%,transparent)}
.dl2a-auto{display:inline-flex;align-items:center;gap:8px;height:28px;font-size:13px;color:var(--dm-fg2);cursor:pointer;white-space:nowrap}
.dl2a-sum{font-size:12.5px;color:var(--dm-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dl2a-send{flex:none}
.dl2a-send[hidden]{display:none}

/* the body: what is waiting, the switchboard (the task being routed and its routes) and the agents */
.dl2a-body{position:relative;display:flex;flex-direction:column}
.dl2a-in{display:flex;align-items:center;gap:8px;height:40px;padding:4px 2px;margin:-4px -2px 12px;position:relative;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.dl2a-inl{font-size:12.5px;color:var(--dm-muted);flex:none;margin-right:4px}
.dl2a-in .dl2a-empty{font-size:12.5px;color:var(--dm-muted)}

/* a task: a card you can drag or press (a menu sends it to an agent) */
.dl2a-t{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px 0 8px;max-width:220px;flex:none;border-radius:calc(10px * var(--dm-rk-m,var(--dm-rk)));background:var(--dm-surface);box-shadow:var(--dm-shadow);font-size:12.5px;color:var(--dm-fg);text-align:left;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;transition:background-color var(--dm-t-fast) var(--dm-ease),opacity var(--dm-t-fast)}
.dl2a-t .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dl2a-t .src{width:20px;height:20px;border-radius:calc(6px * var(--dm-rk-s,var(--dm-rk)));display:grid;place-items:center;background:var(--dm-chip);color:var(--dm-fg2);flex:none}
.dl2a-t .src .i{width:12px;height:12px}
@media (hover:hover) and (pointer:fine){.dl2a-t:hover{background:var(--dm-row)}}
.dl2a-t.lift{opacity:.35}
.dl2a-ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;margin:0;box-shadow:var(--dm-shadow-pop);cursor:grabbing}
.dl2a-ghost.abs{position:absolute}

/* the switchboard: the task being routed, centred, with its reason under it */
.dl2a-rt{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;z-index:2}
.dl2a-slot{display:flex;justify-content:center;width:100%;min-height:48px;align-items:center}
.dl2a-cur{height:48px;max-width:min(100%,360px);padding:0 16px 0 8px;gap:12px;font-size:13px}
.dl2a-cur .src{width:32px;height:32px;border-radius:calc(9px * var(--dm-rk-m,var(--dm-rk)))}
.dl2a-cur .src .i{width:16px;height:16px}
.dl2a-cur .w{display:flex;flex-direction:column;min-width:0}
.dl2a-cur .w .tx{font-weight:500}
.dl2a-cur .w small{font-size:12px;line-height:16px;color:var(--dm-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl2a-idle{height:48px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dm-muted)}
.dl2a-idle .i{color:var(--dm-ok-mark)}
.dl2a-why{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;min-height:20px;font-size:12.5px;color:var(--dm-fg2);text-align:center}
.dl2a-why:empty{display:none}
.dl2a-why b{font-weight:500;color:var(--dm-fg)}
.dl2a-why .tag .i{width:12px;height:12px}
.dl2a-why .tag .i.okk{color:var(--dm-ok-mark)}
.dl2a-why .tag.you{background:var(--dm-accent-bg);color:var(--dm-accent-fg)}
.dl2a-why .av{width:16px;height:16px;font-size:8px}

/* the routes: a neutral line from the switchboard to every agent, drawn on the body; in Blueprint they turn square corners */
.dl2a-fan{height:96px;flex:none}
.dl2a-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0}
.dl2a-lines path{fill:none;stroke:var(--dm-rail);stroke-width:1.5;stroke-linecap:round;transition:stroke var(--dm-t-fast) var(--dm-ease),opacity var(--dm-t) var(--dm-ease),stroke-width var(--dm-t-fast)}
.dl2a.scan .dl2a-lines path{stroke-dasharray:3 5;animation:dl2a-flow .5s linear infinite}
.dl2a-lines path.on{stroke:var(--dm-accent-mark);stroke-width:2;stroke-dasharray:none;animation:none}
.dl2a-lines path.off{opacity:.4;stroke-dasharray:none;animation:none}
@keyframes dl2a-flow{to{stroke-dashoffset:-8}}

/* the agents */
.dl2a-docks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;position:relative;z-index:1}
.dl2a-dk{position:relative;display:flex;flex-direction:column;gap:8px;min-width:0;border-radius:calc(12px * var(--dm-rk-m,var(--dm-rk)));transition:background-color var(--dm-t-fast) var(--dm-ease),box-shadow var(--dm-t-fast) var(--dm-ease)}
.dl2a-dk.over{background:var(--dm-chip);box-shadow:0 0 0 8px var(--dm-chip)}
.dl2a-dh{display:flex;align-items:center;gap:8px;min-width:0;position:relative}
.dl2a-mk{width:28px;height:28px;border-radius:calc(8px * var(--dm-rk-m,var(--dm-rk)));display:grid;place-items:center;background:var(--ag);color:var(--ag-ink);flex:none;position:relative;z-index:1}
.dl2a-mk .i{width:14px;height:14px}
.dl2a-nm{display:flex;flex-direction:column;min-width:0}
.dl2a-nm b{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl2a-st{font-size:12px;line-height:16px;color:var(--dm-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.dl2a-st .dot{color:var(--dm-ok-mark)}
/* an agent's fit for the task being routed: an opaque neutral chip on its route, just above the agent */
.dl2a-sc{position:absolute;left:14px;top:-28px;transform:translateX(-50%) scale(.9);height:20px;padding:0 7px;display:inline-flex;align-items:center;border-radius:var(--dm-r-tag);font-size:11.5px;font-weight:500;color:var(--dm-muted);background:var(--dm-surface);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--dm-line-strong) 35%,transparent);white-space:nowrap;opacity:0;transition:opacity var(--dm-t-fast) var(--dm-ease),transform var(--dm-t) var(--dm-ease),color var(--dm-t-fast),background var(--dm-t-fast);z-index:2}
.dl2a-sc.show{opacity:1;transform:translateX(-50%)}
.dl2a-sc.win{color:var(--dm-accent-fg);background:linear-gradient(var(--dm-accent-bg),var(--dm-accent-bg)),var(--dm-surface);box-shadow:none}
.dl2a-q{display:flex;flex-direction:column;gap:6px;min-width:0}
.dl2a-qi{width:100%;max-width:none;height:32px;padding:0 10px;position:relative;overflow:hidden}
.dl2a-qi.run{cursor:default;padding-bottom:2px}
.dl2a-qi.run::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:calc(var(--p,0) * 100%);background:var(--dm-accent-mark);transition:width .25s linear}
.dl2a-qi.done{cursor:default}
.dl2a-qi.done::after{display:none}
.dl2a-qi .ok{color:var(--dm-ok-mark);margin-left:auto;flex:none}
.dl2a-qi .you{width:16px;height:16px;font-size:8px;margin-left:auto}
.dl2a-more{font-size:12px;line-height:16px;color:var(--dm-muted);padding-left:10px}
.dl2a-more:empty{display:none}
.dl2a-cost{font-size:12px;line-height:16px;color:var(--dm-muted)}

.dl2a-menu{min-width:240px}
.dl2a-menu .dl2a-mk{width:24px;height:24px}
.dl2a-menu .dl2a-mk .i{width:12px;height:12px}
.dl2a-menu .mi .d{font-size:12px}
.dl2a-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* phones: the agents become rows, each with its fit at its right; the routes are left out (the rows say the same) */
@container (max-width:560px){
  .dl2a-fan{height:16px}
  .dl2a-lines{display:none}
  .dl2a-docks{grid-template-columns:minmax(0,1fr);gap:4px}
  .dl2a-dk{display:grid;grid-template-columns:minmax(0,1fr);padding:8px;margin:0 -8px;gap:8px}
  .dl2a-dk.over{box-shadow:none}
  .dl2a-dk.win{background:var(--dm-chip)}
  .dl2a-sc{position:static;transform:none;margin-left:auto;flex:none}
  .dl2a-sc.show{transform:none}
  .dl2a-q{padding-left:36px}
  .dl2a-q:empty{display:none}
  .dl2a-more{padding-left:46px}
  .dl2a-cur{max-width:100%}
  .dl2a-sum .dl2a-long{display:none}
}

/* Soft: plush corners come from --dm-rk; the cards' soft shadows from --dm-shadow */
/* Blueprint: square, hairlines, the technical sheet's grid behind the switchboard */
:root:not([data-style]) .dl2a-t{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--dm-rail) 60%,transparent)}
:root:not([data-style]) .dl2a-ghost{box-shadow:inset 0 0 0 1px var(--dm-line-strong),0 12px 28px -14px rgba(20,20,12,.3)}
:root:not([data-style]) .dl2a-lines path{stroke-linecap:square;stroke-width:1}
:root:not([data-style]) .dl2a-lines path.on{stroke-width:1.5;stroke:var(--dm-fg)}
:root:not([data-style]) .dl2a-sc{box-shadow:inset 0 0 0 1px var(--dm-rail);font-size:10.5px;letter-spacing:.03em}
:root:not([data-style]) .dl2a-sc.win{background:var(--dm-accent);color:var(--dm-on-accent)}
:root:not([data-style]) .dl2a-why .tag.you{background:var(--dm-accent);color:var(--dm-on-accent)}
:root:not([data-style]) .dl2a-qi.run::after{background:var(--dm-fg)}
:root:not([data-style]) .dl2a-dk.over{background:var(--dm-wash);box-shadow:0 0 0 8px var(--dm-wash),0 0 0 9px var(--dm-rail)}
:root:not([data-style]) .dl2a-hi{background:none;box-shadow:inset 0 0 0 1px var(--dm-rail)}

/* Clean: a head strip and a foot strip, monochrome chrome, ink switch; agents keep their colours */
:root[data-style="clean"] .dl2a{padding:0;gap:0;border-radius:var(--dm-r-card);overflow:clip}
:root[data-style="clean"] .dl2a.growing>.dm-grow{gap:0}
:root[data-style="clean"] .dl2a-h{padding:var(--dm-strip-y) 16px;background:var(--dm-strip);border-bottom:1px solid var(--dm-line);border-radius:var(--dm-r-card) var(--dm-r-card) 0 0}
:root[data-style="clean"] .dl2a-body{padding:16px}
:root[data-style="clean"] .dl2a-f{padding:var(--dm-strip-y) 16px;background:var(--dm-strip);border-top:1px solid var(--dm-line);border-radius:0 0 var(--dm-r-card) var(--dm-r-card)}
:root[data-style="clean"] .dl2a-hi{background:var(--dm-surface);box-shadow:var(--dm-btn2-depth);border-radius:10px}
:root[data-style="clean"] .dl2a-t{border-radius:10px;box-shadow:inset 0 0 0 1px var(--dm-hair),0 1px 2px rgba(0,0,0,.04)}
:root[data-style="clean"][data-theme="dark"] .dl2a-t{background:var(--dm-raised)}
:root[data-style="clean"] .dl2a-t .src{border-radius:6px}
:root[data-style="clean"] .dl2a-cur .src{border-radius:8px}
:root[data-style="clean"] .dl2a-mk{border-radius:8px}
:root[data-style="clean"] .dl2a-dk{border-radius:12px}
:root[data-style="clean"] .dl2a-dk.over{background:var(--dm-row-on);box-shadow:0 0 0 8px var(--dm-row-on)}
:root[data-style="clean"] .dl2a-dk.win{background:var(--dm-row-on)}
:root[data-style="clean"] .dl2a-auto{height:28px;padding:0 10px 0 8px;margin-left:-8px;border-radius:999px;transition:background-color var(--dm-t-fast) var(--dm-ease)}
@media (hover:hover) and (pointer:fine){:root[data-style="clean"] .dl2a-auto:hover{background:var(--dm-row);color:var(--dm-fg)}}
:root[data-style="clean"] .dl2a-lines path.on{stroke:var(--dm-accent-mark)}
@container (max-width:560px){:root[data-style="clean"] .dl2a-dk{margin:0 -8px}}

@media (prefers-reduced-motion:reduce){.dl2a.scan .dl2a-lines path{animation:none}.dl2a-qi.run::after{transition:none}}
</style>
</head>
<body>
<header class="dl2a-top">
  <div class="dl2a-intro">
    <h1>Switchboard <span>· Hand-off lab, variation 2a</span></h1>
    <p>Every task that comes in is weighed against each agent's skill, wait and cost, and travels down the route of the best fit with its reason; drag it to another agent to overrule the pick.</p>
  </div>
  <div class="dl2a-ctl">
    <div class="dl2a-seg" role="group" aria-label="Style" id="dl2a-style"><button type="button" data-v="bp">Blueprint</button><button type="button" data-v="soft">Soft</button><button type="button" data-v="clean">Clean</button></div>
    <div class="dl2a-seg" role="group" aria-label="Theme" id="dl2a-theme"><button type="button" data-v="light">Light</button><button type="button" data-v="dark">Dark</button></div>
    <button class="dl2a-rp" type="button" id="dl2a-replay"><svg class="i s" aria-hidden="true"><use href="#i-refresh"/></svg>Replay</button>
  </div>
</header>
<main class="dl2a-stage">
  <div class="card dl2a-card" data-c="dl2a">
    <div class="stage-in"></div>
    <template><div class="dl2a panel" role="region" aria-label="Task routing">
      <div class="dl2a-h">
        <span class="dl2a-hi" aria-hidden="true"><svg class="i s"><use href="#i-branch"/></svg></span>
        <span class="dl2a-hw"><span class="dl2a-ttl">Routing</span><span class="dl2a-meta"><span class="num dl2a-nw">0</span> waiting</span></span>
        <span class="dl2a-sp"></span>
        <span class="dl2a-meta"><span class="num dl2a-usd">$0.00</span> spent today</span>
      </div>
      <div class="dl2a-body">
        <div class="dl2a-in" role="list" aria-label="Waiting"><span class="dl2a-inl">Next</span></div>
        <div class="dl2a-rt"><div class="dl2a-slot"></div><div class="dl2a-why"></div></div>
        <div class="dl2a-fan" aria-hidden="true"></div>
        <svg class="dl2a-lines" aria-hidden="true"></svg>
        <div class="dl2a-docks"></div>
      </div>
      <div class="dl2a-f">
        <label class="dl2a-auto"><button class="toggle" type="button" role="switch" aria-checked="true"></button><span>Route for me</span></label>
        <span class="dl2a-sp"></span>
        <span class="dl2a-sum"></span>
        <button class="pill primary sm dl2a-send" type="button" hidden>Send</button>
      </div>
      <p class="dl2a-sr" aria-live="polite"></p>
    </div>
    <div class="pop dl2a-menu" role="menu" aria-label="Send to"></div></template>
  </div>
</main>
<script src="assets/core.js"></script>
<script>
/* ---------- the lab page: style, theme and replay ---------- */
(() => {
  const d = document.documentElement;
  const mark = () => {
    const s = d.getAttribute('data-style') || 'bp', t = d.getAttribute('data-theme');
    document.querySelectorAll('#dl2a-style button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === s));
    document.querySelectorAll('#dl2a-theme button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === t));
  };
  document.getElementById('dl2a-style').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.v === 'bp') d.removeAttribute('data-style'); else d.setAttribute('data-style', b.dataset.v);
    try { localStorage.setItem('dmui-style', b.dataset.v); } catch(x){} mark(); window.dispatchEvent(new Event('dl2a-restyle')); });
  document.getElementById('dl2a-theme').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
    d.setAttribute('data-theme', b.dataset.v); try { localStorage.setItem('dmui-theme', b.dataset.v); } catch(x){} mark(); });
  document.getElementById('dl2a-replay').addEventListener('click', () => DM.mount(document.querySelector('[data-c="dl2a"]')));
  mark();
})();

/* ---------- Switchboard ---------- */
DM.PLAYS.add('dl2a');
DM.def('dl2a', (st, c, card) => {

  c.on(sendB, 'click', () => { if (cur && phase === 'wait'){ busy = true; send(cur, cur.win); } });
  const ro = new ResizeObserver(() => { lines(); }); ro.observe(body); c.offs.push(() => ro.disconnect());
  c.on(window, 'dl2a-restyle', () => requestAnimationFrame(lines));
  // a running item can't be dragged or sent on; it says so instead of doing nothing
  c.on(root, 'click', e => { const el = e.target.closest('.dl2a-qi.run'); if (el) say(`${el.textContent.trim()} is running`); });

  drawAll(); drawIn(); drawSum(); idle(); usdEl.textContent = money(spent);
  requestAnimationFrame(() => requestAnimationFrame(lines));

  /* ---- the demo: work arrives; Route for me sends the first two; you turn it off, overrule a pick by dragging, approve one,
     and turn it back on. It loops; a click, drag or key inside stops it for good, until Replay ---- */
  const stage = c.st; let hand = null;
  const handTo = async (el, ms = 520, dx = .55, dy = .6) => {
    if (!hand){ hand = html('<span class="hand" aria-hidden="true"><svg viewBox="0 0 18 18"><path d="M3 2l11.5 6.1-5 1.5-2.4 5z"/></svg></span>'); stage.appendChild(hand); }
    const s = stage.getBoundingClientRect(), b = el.getBoundingClientRect(), x = b.left - s.left + b.width * dx, y = b.top - s.top + b.height * dy;
    if (!hand.classList.contains('on')){ hand.style.transition = 'none'; hand.style.transform = `translate(${x + 30}px,${y + 36}px)`; void hand.offsetWidth; hand.classList.add('on'); }
    hand.style.transition = R ? 'none' : `transform ${ms}ms ${EASE()},opacity .16s`; hand.style.transform = `translate(${x}px,${y}px)`;
    await c.step(R ? 0 : ms);
  };
  const press = async () => { hand.classList.remove('down'); void hand.offsetWidth; hand.classList.add('down'); await c.step(180); c.later(300, () => hand && hand.classList.remove('down')); };
  const away = () => { if (hand) hand.classList.remove('on', 'down'); };
  c.taken(() => { away(); });
  // the demo's drag: the hand takes the card and carries it to an agent
  async function demoDrag(el, toDock){
    await handTo(el, 560, .5, .55); hand.classList.add('down'); await c.step(220);
    const r = el.getBoundingClientRect(), d = $('.dl2a-q', toDock).getBoundingClientRect(), mk = $('.dl2a-mk', toDock).getBoundingClientRect();
    const tx = (narrow() ? mk.left + 40 : d.left) - r.left, ty = (narrow() ? mk.top : d.top + d.height) - r.top;
    const s = stage.getBoundingClientRect(), g = el.cloneNode(true); g.className = el.className + ' dl2a-ghost abs'; g.removeAttribute('data-id'); g.setAttribute('aria-hidden', 'true');
    Object.assign(g.style, { left:(r.left - s.left) + 'px', top:(r.top - s.top) + 'px', width:r.width + 'px', height:r.height + 'px' });
    stage.appendChild(g); el.classList.add('lift'); c.taken(() => { g.remove(); el.classList.remove('lift'); toDock.classList.remove('over'); });
    const ms = R ? 0 : 900;
    if (!R) g.animate([{ transform:'none' }, { transform:'translate(0,-6px) rotate(-1.5deg)', offset:.15 }, { transform:`translate(${tx}px,${ty}px) rotate(-1.5deg)` }], { duration:ms, easing:'cubic-bezier(.45,.05,.3,1)', fill:'forwards' });
    hand.style.transition = `transform ${ms}ms cubic-bezier(.45,.05,.3,1)`; const hb = hand.style.transform.match(/-?[\d.]+/g).map(Number);
    hand.style.transform = `translate(${hb[0] + tx}px,${hb[1] + ty}px)`;
    c.later(ms * .6, () => toDock.classList.add('over'));
    await c.step(ms + 120);
    toDock.classList.remove('over'); g.remove(); el.classList.remove('lift'); hand.classList.remove('down');
    assign(el.dataset.id, toDock.dataset.a, true, true);
  }
  const until = async f => { while (!f()) await c.step(100); };
  c.run(async () => {
    await c.step(700);
    for (const [i, t] of INCOMING.entries()){ add(t); await c.step(R ? 0 : 260); }
    // two routed on their own
    await until(() => routed >= 2);
    // you turn Route for me off, so the next pick waits for you
    await handTo($('.dl2a-auto', root), 700, .2, .5); await press(); setAuto(false); await c.step(500); away();
    await until(() => phase === 'wait');
    await c.step(1400);
    // the pick is Coder, who is busy for a while: you send it to Researcher instead
    await demoDrag($('.dl2a-cur', slot), dock('res')); away();
    await until(() => phase === 'wait'); await c.step(1300);
    // the next pick is right: Send
    await handTo(sendB, 600); await press(); sendB.click(); await c.step(400);
    // and Route for me back on for the rest
    await handTo($('.dl2a-auto', root), 700, .2, .5); await press(); setAuto(true); await c.step(400); away();
    await until(() => !cur && !waiting.length); await c.step(3200);
    if (R) return;
    const out = st.animate([{ opacity:1 }, { opacity:0 }], { duration:320, easing:'ease-out', fill:'forwards' });
    await out.finished; if (c.mine || c.dead) { out.cancel(); return; }
    DM.mount(card, true); st.animate([{ opacity:0 }, { opacity:1 }], { duration:320, easing:'ease-out' }); out.cancel();
  });
});
</script>
