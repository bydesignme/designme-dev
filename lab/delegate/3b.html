<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>3b Team canvas · Delegate · Designme.dev lab</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<script>(function(){var d=document.documentElement,q=new URLSearchParams(location.search),s,t;try{s=localStorage.getItem('dmui-style');t=localStorage.getItem('dmui-theme')}catch(e){}var qs=q.get('style'),qt=q.get('theme');if(qs==='bp'||qs==='soft'||qs==='clean'){s=qs;try{localStorage.setItem('dmui-style',s)}catch(e){}}if(qt==='light'||qt==='dark'){t=qt;try{localStorage.setItem('dmui-theme',t)}catch(e){}}if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';if(s!=='bp'&&s!=='soft'&&s!=='clean')s=t==='dark'?'bp':'soft';d.setAttribute('data-theme',t);d.setAttribute('data-style',s)})();</script>
<link rel="stylesheet" href="assets/core.css">
<link rel="stylesheet" href="3-shell.css">
<link rel="stylesheet" href="3b.css">
</head>
<body>
<header class="dl3-top">
  <div class="dl3-id">
    <h1>3b · Team canvas</h1>
    <p>Your agents as a live map: drop work on an agent and watch the work pass along the hand-offs, with progress and spend on every node.</p>
  </div>
  <div class="dl3-ctl">
    <div class="dl3-seg" role="group" aria-label="Style"><button type="button" data-dl3-style="bp">Blueprint</button><button type="button" data-dl3-style="soft">Soft</button><button type="button" data-dl3-style="clean">Clean</button></div>
    <div class="dl3-seg" role="group" aria-label="Theme"><button type="button" data-dl3-theme="light">Light</button><button type="button" data-dl3-theme="dark">Dark</button></div>
    <button type="button" class="dl3-again"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>Animate</button>
  </div>
</header>
<main class="dl3-main">
  <div class="dl3-stage">
    <article class="dl3-card" data-c="dl3b" aria-label="Team canvas, an example component">
      <div class="stage-in"></div>
      <template><section class="dl3b panel" aria-label="Team canvas">
  <div class="dl3b-h">
    <span class="dl3b-hic" aria-hidden="true"><svg class="i s"><use href="#i-users"/></svg></span>
    <span class="dl3b-ht"><span class="dl3b-t">Team canvas</span><span class="dl3b-hm num">2 working · 0 done</span></span>
    <span class="dl3b-sp"><b class="dl3b-spv num">$0.00</b> <span>spent</span></span>
    <span class="dl3b-hsep" aria-hidden="true"></span>
    <label class="dl3b-auto"><span>Autopilot</span><button type="button" class="toggle" role="switch" aria-checked="false" aria-label="Autopilot: hand new tasks out by themselves"></button></label>
  </div>
  <div class="dl3b-cv"><div class="dl3b-map">
    <svg class="dl3b-svg" aria-hidden="true"></svg>
    <div class="dl3b-grid" role="group" aria-label="Agents"></div>
  </div></div>
  <div class="dl3b-dock" role="group" aria-label="Waiting tasks">
    <span class="dl3b-dl"><b class="num">0</b> waiting</span>
    <div class="dl3b-toks"></div>
    <span class="dl3b-hint">Drop work on whoever should take it</span>
  </div>
  <div class="dl3b-live" aria-live="polite"></div>
</section></template>
    </article>
  </div>
</main>
<script src="assets/core.js"></script>
<script src="3-shell.js"></script>
<script src="3b.js"></script>
</body>
</html>
