<!doctype html>
<html lang="en" data-style="soft">
<head>
<meta charset="utf-8">

<title>Agent run timeline · Designme.dev lab</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<script>
/* the style and theme come from the address (?style=bp&theme=dark), then from what the site last used, then Soft light */
(function(){ var d = document.documentElement, q = new URLSearchParams(location.search), s = q.get('style'), t = q.get('theme');
  try { s = s || localStorage.getItem('dmui-style') || 'soft'; t = t || localStorage.getItem('dmui-theme'); } catch(e){}
  if (s === 'bp' || s === 'blueprint') d.removeAttribute('data-style'); else d.setAttribute('data-style', 'soft');
  d.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light'); })();
</script>
<style>
@font-face{font-family:Inter;font-style:normal;font-weight:400;font-display:swap;src:url(../../fonts/inter-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

<style>
/* ---------- tokens ----------
   components/assets/core.css ships the install's prefixed tokens (--dm-*). The component (art.css) is written with the short
   names the site's source (soft-2/index.html) uses, so it can move there as it is; on this page they point at the core's */
:root{
  --page:var(--dm-page); --stage:var(--dm-stage); --surface:var(--dm-surface); --raised:var(--dm-raised);
  --fg:var(--dm-fg); --fg2:var(--dm-fg2); --muted:var(--dm-muted); --faint:var(--dm-faint); --rail:var(--dm-rail); --line:var(--dm-line); --line-strong:var(--dm-line-strong);
  --chip:var(--dm-chip); --hover:var(--dm-hover); --row:var(--dm-row); --grid:var(--dm-grid); --sel:var(--dm-sel);
  --accent:var(--dm-accent); --accent-fg:var(--dm-accent-fg); --accent-mark:var(--dm-accent-mark); --accent-bg:var(--dm-accent-bg); --on-accent:var(--dm-on-accent);
  --ok:var(--dm-ok); --ok-bg:var(--dm-ok-bg); --ok-mark:var(--dm-ok-mark); --warn:var(--dm-warn); --warn-bg:var(--dm-warn-bg); --warn-mark:var(--dm-warn-mark); --bad:var(--dm-bad); --bad-bg:var(--dm-bad-bg); --bad-mark:var(--dm-bad-mark);
  --pl:var(--dm-pl); --pl-bg:var(--dm-pl-bg); --pt:var(--dm-pt); --pt-bg:var(--dm-pt-bg); --pp:var(--dm-pp); --pp-bg:var(--dm-pp-bg);
  --rk:var(--dm-rk); --r-card:var(--dm-r-card); --r-in:var(--dm-r-in); --r-sm:var(--dm-r-sm); --r-xs:var(--dm-r-xs); --r-pill:var(--dm-r-pill);
  --s-1:var(--dm-s-1); --s-2:var(--dm-s-2); --s-3:var(--dm-s-3); --s-4:var(--dm-s-4); --s-5:var(--dm-s-5); --s-6:var(--dm-s-6); --s-8:var(--dm-s-8);
  --sans:var(--dm-sans); --ease:var(--dm-ease); --ease-io:var(--dm-ease-io); --t-fast:var(--dm-t-fast); --t:var(--dm-t); --t-slow:var(--dm-t-slow);
}
/* ---------- the page ---------- */
html,body{margin:0;background:var(--page)}
body{font-family:var(--sans);font-size:14px;line-height:1.5;color:var(--fg);-webkit-font-smoothing:antialiased}
:where(.lab) button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:where(.lab) :focus-visible{outline:2px solid var(--line-strong);outline-offset:2px;border-radius:6px}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.lab{max-width:840px;margin:0 auto;padding:var(--s-8) var(--s-6) 72px}
.lab-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:var(--s-4) var(--s-6);padding-bottom:var(--s-5)}
.lab-h h1{margin:0;font-size:14px;font-weight:500;line-height:1.4}
.lab-h h1 span{color:var(--muted);font-weight:400}
.lab-h p{margin:var(--s-1) 0 0;max-width:540px;font-size:13px;line-height:1.55;color:var(--muted);text-wrap:pretty}
.lab-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-2)}
.lab-ctl .seg2 button{color:var(--muted)}
.lab-ctl .seg2 button[aria-pressed="true"]{color:var(--fg)}
.lab-rp{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:var(--r-pill);background:var(--chip);font-size:12.5px;color:var(--fg);transition:background var(--t-fast)}
.lab-rp:hover{background:var(--hover)}
.lab-rp .i{color:var(--fg2)}
/* the stage: the component sits centred in it at every height */
.fr-st{display:flex;align-items:center;justify-content:center;min-height:660px;padding:var(--s-6) var(--s-4);border-radius:var(--r-card);background:var(--stage);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--line) 50%,transparent)}
.fr-st>.card{width:100%;display:flex;justify-content:center}
.fr-st .stage-in{width:100%;display:flex;justify-content:center}
:root:not([data-style="soft"]) .fr-st{border-radius:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px}
:root:not([data-style="soft"]) :is(.lab-rp,.lab-ctl .seg2,.lab-ctl .seg2 *){border-radius:0}
:root:not([data-style="soft"]) .lab-h h1{font-size:12px;letter-spacing:.04em;text-transform:uppercase}
@media (max-width:640px){.lab{padding:var(--s-6) var(--s-4) 56px}.fr-st{padding:var(--s-4) var(--s-3);min-height:640px}}
</style>
<link rel="stylesheet" href="art.css">
</head>
<body>
<main class="lab">
  <header class="lab-h">
    <div>
      <h1>Agent run timeline <span>· lines and flow</span></h1>
      <p>Every model and tool step of a run on one time axis. The rail is grey ahead of the run and tinted behind it, each tool call branches off the step that made it, and the flow runs down the rail to the step at work.</p>
    </div>
    <div class="lab-ctl">
      <div class="seg2" id="sw-style" role="group" aria-label="Style"><button type="button" data-v="soft" aria-pressed="true">Soft</button><button type="button" data-v="bp" aria-pressed="false">Blueprint</button></div>
      <div class="seg2" id="sw-theme" role="group" aria-label="Theme"><button type="button" data-v="light" aria-pressed="true">Light</button><button type="button" data-v="dark" aria-pressed="false">Dark</button></div>
      <button type="button" class="lab-rp" id="replay" aria-label="Replay the run"><svg class="i s" aria-hidden="true"><use href="#i-refresh"/></svg>Replay</button>
    </div>
  </header>

  <div class="fr-st">
    <div class="card wide" data-c="agent-run-timeline"><div class="stage-in"></div><template>
      <div class="art panel dmf" data-reveal="flat">
        <div class="art-h"><div class="art-hd"><div class="art-t">Run 4821, update the pricing page</div><span class="art-s num">Starting</span></div><span class="art-tag tag run"><span class="spin" aria-hidden="true"></span>Running</span></div>
        <div class="art-key num" role="list" aria-label="Time by kind of step"></div>
        <div class="art-grid">
          <div class="art-axis" aria-hidden="true"><span></span><div class="art-ticks"></div><span></span></div>
          <div class="art-bg" aria-hidden="true"></div>
          <div class="art-rows" role="list" aria-label="Steps"></div>
          <div class="art-head" aria-hidden="true"><i></i><span class="art-now num">0.0s</span></div>
        </div>
        <div class="art-f num"></div>
        <p class="sr art-live" role="status" aria-live="polite"></p>
      </div>
    </template></div>
  </div>
</main>
<script src="../../components/assets/core.js"></script>
<script src="../flow/flow.js"></script>
<script src="art.js"></script>
<script>
/* ---------- the page: style, theme and replay ---------- */
{
  const d = document.documentElement;
  const mark = (sel, v) => $$(sel + ' button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
  mark('#sw-style', d.dataset.style === 'soft' ? 'soft' : 'bp');
  mark('#sw-theme', d.dataset.theme === 'dark' ? 'dark' : 'light');
  const url = (k, v) => { const q = new URLSearchParams(location.search); q.set(k, v); history.replaceState(null, '', '?' + q.toString().replace(/=(?=&|$)/g, '')); };
  seg($('#sw-style'), v => { if (v === 'soft') d.dataset.style = 'soft'; else delete d.dataset.style; try { localStorage.setItem('dmui-style', v === 'soft' ? 'soft' : 'blueprint'); } catch(e){} url('style', v); });
  seg($('#sw-theme'), v => { d.dataset.theme = v; try { localStorage.setItem('dmui-theme', v); } catch(e){} url('theme', v); });
  $('#replay').addEventListener('click', () => window.LAB.start());
}
</script>
</body>
</html>
