<!doctype html>
<html lang="en" data-style="soft">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Agent builder · Designme.dev lab</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<script>
/* the style and theme come from the address (?style=bp&theme=dark), then from what the site last used, then Soft light */
(function(){ var d = document.documentElement, q = new URLSearchParams(location.search), s = q.get('style'), t = q.get('theme');
  try { s = s || localStorage.getItem('dmui-style') || 'soft'; t = t || localStorage.getItem('dmui-theme'); } catch(e){}
  if (s === 'bp' || s === 'blueprint') d.removeAttribute('data-style'); else d.setAttribute('data-style', 'soft');
  d.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light'); })();
</script>
<style>
@font-face{font-family:Inter;font-style:normal;font-weight:400;font-display:swap;src:url(../../fonts/inter-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Inter;font-style:normal;font-weight:500;font-display:swap;src:url(../../fonts/inter-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
</style>
<link rel="stylesheet" href="../../components/assets/core.css">
<link rel="stylesheet" href="../flow/flow.css">
<link rel="stylesheet" href="builder.css">
</head>
<body>
<main class="lab">
  <header class="lab-h">
    <div>
      <h1>Agent builder <span>· test run as a flow</span></h1>
      <p>The library's Agent builder with its test drawn as a run: the sample email starts it, a line runs down to the agent and branches to each step it takes. Set Linear or Gmail to Read and test again to see a step fail.</p>
    </div>
    <div class="lab-ctl">
      <div class="seg2" id="sw-style" role="group" aria-label="Style"><button type="button" data-v="soft" aria-pressed="true">Soft</button><button type="button" data-v="bp" aria-pressed="false">Blueprint</button></div>
      <div class="seg2" id="sw-theme" role="group" aria-label="Theme"><button type="button" data-v="light" aria-pressed="true">Light</button><button type="button" data-v="dark" aria-pressed="false">Dark</button></div>
      <button type="button" class="lab-rp" id="replay" aria-label="Replay Agent builder"><svg class="i s" aria-hidden="true"><use href="#i-refresh"/></svg>Replay</button>
    </div>
  </header>
  <div class="fr-st">
    <div class="card" data-c="agent-builder"><div class="stage-in"></div><template><div class="abx panel dmf"><div class="abx-g">
  <div class="abx-f">
    <div class="abx-ask"><label class="abx-l" for="abx-desc">Describe your agent</label><div class="abx-askr"><input class="abx-in" id="abx-desc" autocomplete="off" placeholder="What should it do?"><button class="pill primary sm abx-go">{spark}Draft</button></div></div>
    <div class="abx-s" data-s="id" role="group" aria-label="Identity"><div class="abx-sh"><span>Identity</span></div>
      <div class="abx-idr"><span class="abx-av"></span><input class="abx-in abx-name" aria-label="Name" placeholder="Name" autocomplete="off">
        <div class="abx-look"><div class="abx-sw" role="radiogroup" aria-label="Colour"></div><div class="seg2 abx-shp" role="radiogroup" aria-label="Shape"></div></div></div>
      <span class="abx-err" hidden>{alert}Give it a name to save it</span>
      <input class="abx-in abx-purp" aria-label="Purpose" placeholder="What it is for" autocomplete="off">
    </div>
    <div class="abx-s" data-s="ins" role="group" aria-label="Instructions"><div class="abx-sh"><span>Instructions</span></div><textarea class="abx-ta" rows="3" aria-label="Instructions" placeholder="How it should work"></textarea></div>
    <div class="abx-s" data-s="model" role="group" aria-label="Model and effort"><div class="abx-sh"><span>Model and effort</span></div>
      <div class="abx-mr"><select class="abx-in abx-sel" aria-label="Model"><option>Haiku 5</option><option>Sonnet 5</option><option>Opus 5.5</option></select><div class="seg2 abx-eff" role="group" aria-label="Effort"><button aria-pressed="false" data-v="low">Low</button><button aria-pressed="true" data-v="med">Medium</button><button aria-pressed="false" data-v="high">High</button></div></div>
    </div>
    <div class="abx-s" data-s="tools" role="group" aria-label="Tools"><div class="abx-sh"><span>Tools</span><span class="muted">What it may do in each</span></div><div class="abx-tools"></div></div>
    <div class="abx-s" data-s="know" role="group" aria-label="Knowledge"><div class="abx-sh"><span>Knowledge</span></div><div class="abx-kn"></div></div>
    <div class="abx-s" data-s="trig" role="group" aria-label="Trigger"><div class="abx-sh"><span>Trigger</span></div>
      <div class="abx-tr"><div class="seg2 abx-trs" role="group" aria-label="Starts on"><button aria-pressed="true" data-v="chat">Chat</button><button aria-pressed="false" data-v="sched">Schedule</button><button aria-pressed="false" data-v="event">Event</button></div><span class="muted abx-trd">When someone messages it</span></div>
    </div>
    <div class="abx-bar"><span class="abx-st muted">Not saved</span><span class="sp"></span><button class="pill line sm abx-test">{play}Test</button><button class="pill line sm abx-save">Save</button><button class="pill primary sm abx-pub">Publish</button></div>
  </div>
  <div class="abx-c">
    <div class="abx-ch"><div class="abx-cht"><b>Test</b><span class="muted abx-cs">Try it before it goes live</span></div></div>
    <div class="abx-log" aria-live="polite"><p class="muted abx-empty">Draft the agent, then press Test to send it a sample email.</p></div>
  </div>
  </div><p class="abx-sr" role="status"></p>
</div></template></div>
  </div>
</main>
<script src="../../components/assets/core.js"></script>
<script src="../flow/flow.js"></script>
<script src="builder.js"></script>
</body>
</html>
