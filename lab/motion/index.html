<!doctype html>
<html lang="en" data-style="soft">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Motion packs · Designme.dev lab</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<!-- owner, 17 Nov: the Agent tree moved six ways, the library's motion today and one pack per motion skill from ui-skills.com,
     to pick the library's motion. Lab only; nothing ships from here -->
<script>
(function(){ var d = document.documentElement, q = new URLSearchParams(location.search), s = q.get('style'), t = q.get('theme');
  try { s = s || localStorage.getItem('dmui-style') || 'soft'; t = t || localStorage.getItem('dmui-theme'); } catch(e){}
  if (s === 'bp') d.removeAttribute('data-style'); else d.setAttribute('data-style', 'soft');
  d.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light'); })();
</script>
<link rel="stylesheet" href="../../components/assets/core.css">
<link rel="stylesheet" href="../flow/flow.css">
<link rel="stylesheet" href="motion.css">
</head>
<body>
<header class="mo-top">
  <b>Motion packs</b><span class="muted">The Agent tree, one run, six ways of moving it</span>
  <span class="sp"></span>
  <button class="mo-btn" id="mo-all">Replay all</button>
  <div class="mo-seg" id="mo-loop-wrap"><button id="mo-loop" aria-pressed="true">Loop</button></div>
  <div class="mo-seg" id="mo-speed" role="group" aria-label="Speed"><button data-v="1">1x</button><button data-v="0.25">0.25x</button></div>
  <div class="mo-seg" id="mo-style" role="group" aria-label="Style"><button data-v="soft">Soft</button><button data-v="bp">Blueprint</button></div>
  <div class="mo-seg" id="mo-theme" role="group" aria-label="Theme"><button data-v="light">Light</button><button data-v="dark">Dark</button></div>
</header>
<main class="mo-grid" aria-label="Motion packs"></main>
<script src="../agent-tree/marks.js"></script>
<script src="../flow/flow.js"></script>
<script src="motion.js"></script>
</body>
</html>
